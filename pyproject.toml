[project]
name = "expensetracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nirvika Rajendra", email = "nirvikarajendra16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=3.4.6",
    "google-adk>=2.6.3",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
]

[project.scripts]
expensetracker = "expensetracker:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
